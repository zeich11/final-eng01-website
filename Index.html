function parse(raw) {
  var ps = [], n = 0;
  raw.split("\n").forEach(function (ln) {
    if (ln[0] === "#") { var h = ln.slice(1).split("|"); ps.push({ name: h[0], tip: h[1], items: [] }); }
    else if (ln[0] === "@") { var p = ln.slice(1).split("|"); ps[ps.length - 1].items.push({ pass: p[0], paras: p.slice(1) }); }
    else { var f = ln.split("|"); ps[ps.length - 1].items.push({ n: ++n, q: f[0], o: f.slice(1, 5), a: "ABCD".indexOf(f[5]) }); }
  });
  return { parts: ps, total: n };
}
